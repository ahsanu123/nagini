[project]
name = "nagini"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
authors = [
    { name = "Ahsanu Amala", email = "caasperahsanuamala5@gmail.com" }
]

dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.12.5",
    "sqlalchemy>=2.0.46",
    "matplotlib>=3.10.8",
    "numpy>=2.4.2",
]

[project.scripts]
cli = "nagini.cli:main"

[dependency-groups]
dev = [
    "alembic>=1.18.4",
    "pytest>=9.0.2",
]

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"
